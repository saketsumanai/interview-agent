[tool.uv]
package = false


[project]
name = "agent-starter-python"
version = "1.0.0"
description = "Simple voice AI assistant built with LiveKit Agents for Python"
requires-python = ">=3.9"

dependencies = [
    "livekit-agents[silero,turn-detector,assemblyai,cartesia,google]~=1.2",
    "livekit-plugins-noise-cancellation~=0.2",
    "python-dotenv>=1.2.1",
    "certifi>=2024.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "livekit>=0.17.0",
    "aiohttp>=3.9.0",
    "python-multipart>=0.0.9",
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-google-genai>=1.0.0",
    "langchain-chroma>=0.1.0",
    "chromadb>=0.4.22",
    "pypdf>=3.17.0",
    "google-generativeai>=0.8.0",
    "duckduckgo-search>=6.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "google-cloud-storage>=3.4.1",
    "livekit-plugins-groq>=1.3.5",
    "livekit-plugins-deepgram>=1.3.5",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "types-defusedxml>=0.7.0.20250822",
]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Function call in argument defaults (FastAPI Depends/File/Form)
    "E402",  # Module level import not at top of file (sys.path injection)
    "F401",  # Unused imports (used in try-except fallback blocks)
    "UP006", # Dict vs dict (supports Python 3.9 compatibility)
    "UP035", # typing.Dict vs dict
    "SIM105",# Use contextlib.suppress
    "SIM117",# Combine with statements
    "N811",  # Constant imported as non-constant (STT as DeepgramSTT)
    "N817",  # CamelCase imported as acronym (ElementTree as ET)
    "N818",  # Exception name without Error suffix
    "W293",  # Blank line contains whitespace
    "B007",  # Loop control variable not used
]



[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv.workspace]
members = [
    "backend",
]

[tool.pyright]
extraPaths = ["backend"]

[tool.pyrefly]
search-paths = ["backend"]

